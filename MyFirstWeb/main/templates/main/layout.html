<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title_name %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .spacious-table {
            width: 100%;
            border-collapse: collapse;
        }
        .spacious-table th,
        .spacious-table td {
            padding: 20px 30px;  /* Большие отступы */
            text-align: left;
            border: 1px solid #ddd;
        }
        .spacious-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .layout-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-left {
            width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            margin-left: 280px; /* Отступ равный ширине сайдбара */
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .sidebar-title {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 600;
            font-size: 1.5rem;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 1rem;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 1rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
            text-decoration: none;
            color: white;
        }

        .nav-button {
            background: rgba(255,255,255,0.2) !important;
            border: 2px solid white;
            font-weight: 600;
        }

        .nav-button:hover {
            background: white !important;
            color: #667eea !important;
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .nav-text {
            font-size: 1rem;
        }
    </style>
</head>
<body>
   <div class="layout-container">
    <aside class="sidebar-left">
        <h3 class="sidebar-title">Навигация</h3>
        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="{% url 'index' %}" class="nav-link">
                        <span class="nav-icon">🏠</span>
                        <span class="nav-text">Главная</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'about' %}" class="nav-link">
                        <span class="nav-icon">👥</span>
                        <span class="nav-text">О нас</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'users_show' %}" class="nav-link">
                        <span class="nav-icon">👤</span>
                        <span class="nav-text">Пользователи</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'groups_show' %}" class="nav-link">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-text">Группы</span>
                    </a>
                </li>
                <!-- НОВЫЙ ПУНКТ - Все посты -->
                <li class="nav-item">
                    <a href="{% url 'posts_show' %}" class="nav-link">
                        <span class="nav-icon">📝</span>
                        <span class="nav-text">Все посты</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'create_user' %}" class="nav-link nav-button">
                        <span class="nav-icon">➕</span>
                        <span class="nav-text">Создание пользователя</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'create_group' %}" class="nav-link nav-button">
                        <span class="nav-icon">➕🏢</span>
                        <span class="nav-text">Создание группы</span>
                    </a>
                </li>
                <!-- НОВАЯ КНОПКА - Создать пост -->
                <li class="nav-item">
                    <a href="{% url 'create_post' %}" class="nav-link nav-button">
                        <span class="nav-icon">➕📝</span>
                        <span class="nav-text">Создать пост</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}
        {% for el in values %}
            <p> {{ elements }} </p>
        {% endfor %}
        {% endblock %}
    </main>
</div>
</body>
</html>
